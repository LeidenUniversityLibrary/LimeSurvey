services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "127.0.0.1:${LIMESURVEY_PORT:-8084}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", 'exit(@file_get_contents("http://127.0.0.1/health.php") === "OK\n" ? 0 : 1);']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - config:/var/lib/limesurvey/config
      - uploads:/var/www/html/upload
      - temporary:/var/www/html/tmp

  db:
    image: docker.io/library/mariadb:11.4
    ports:
      - "127.0.0.1:${LIMESURVEY_DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: limesurvey
      MARIADB_USER: limesurvey
      MARIADB_PASSWORD: ${LIMESURVEY_DB_PASSWORD:?Set LIMESURVEY_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${LIMESURVEY_DB_ROOT_PASSWORD:?Set LIMESURVEY_DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - database:/var/lib/mysql

  mailpit:
    image: docker.io/axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  config:
  uploads:
  temporary:
  database:
